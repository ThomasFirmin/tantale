[workspace]
members = [
    "core", 
    "macros", 
    "algorithms", 
    "python", 
    "spikes",
    "tests/tests_core", 
    "tests/tests_algos", 
    "tests/tests_python", 
    "tests/utils",
    "examples"
]

[workspace.package]
authors = ["Thomas Firmin"]
version = "0.5.0"
edition = "2024"
license = "CECILL-C"
readme = "README.md"
rust-version = "1.91.1"
repository = "https://github.com/ThomasFirmin/tantale"
documentation = "https://docs.rs/tantale/latest/tantale/"
description  = "Tantale is a Rust library for Automated Machine Learning (AutoML) focusing on Hyperparameter Optimization and Neural Architecture Search. It provides a modular and extensible framework for defining search spaces, objectives, and optimization algorithms, with support for distributed computing and parallel execution."
keywords     = ["automl", "hpo", "nas"]

[workspace.dependencies]
tantale        = {path = "."}
tantale_core   = {path = "core"}
tantale_macros = {path = "macros"}
tantale_algos  = {path = "algorithms"}
tantale_python  = {path = "python"}
num = "0.4.3"
rand = "0.10.0"
serde = {version="1.0.219", features=["derive","rc"]}
rayon = "1.10.0"
itertools = "0.14.0"
ndarray = {version= "0.17.2", features = ["serde"]}
log = "0.4.33"

[package]
name                    = "tantale"
version.workspace       = true
edition.workspace       = true
authors.workspace       = true
license.workspace       = true
readme.workspace        = true
rust-version.workspace  = true
repository.workspace    = true
documentation.workspace = true
description.workspace   = true
keywords.workspace      = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [ "--html-in-header", "katex-header.html", "--html-in-header", "highlight-header.html" ]

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
tantale_core.workspace   = true
tantale_macros.workspace = true
tantale_algos.workspace  = true
tantale_python = {workspace = true, optional = true}

[features]
mpi = ["tantale_core/mpi", "tantale_algos/mpi", "tantale_macros/mpi"]
bayes = ["tantale_algos/bayes"]
py = ["tantale_python", "tantale_macros/py"]

[dev-dependencies]
tantale_core.workspace   = true
tantale_macros.workspace = true
tantale_algos.workspace  = true
tantale_python.workspace = true
num = "0.4.3"
rand = "0.10.0"
serde = {version="1.0.219", features=["derive","rc"]}
rmp-serde = "1.3.0"